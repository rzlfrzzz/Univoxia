# Salin ke /etc/nginx/sites-available/univoxia lalu ganti IP-ANDA-DENGAN-STRIP
server {
    listen 80;
    server_name univoxia.IP-ANDA-DENGAN-STRIP.sslip.io;

    root /var/www/univoxia;
    index index.html;

    # Frontend (single-page app)
    location / {
        try_files $uri /index.html;
    }

    # API Univoxia (saat ini baru endpoint health)
    location /health/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
